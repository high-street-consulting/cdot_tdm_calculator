    - pricing
    - service
    - program
    - policy
    - land-use
    - technology
  trip_purpose:
    - commute
    - all-trips
    - recreational
  mode:
    - transit
    - bike
    - walk
    - micromobility
    - vanpool
    - auto
  context:
