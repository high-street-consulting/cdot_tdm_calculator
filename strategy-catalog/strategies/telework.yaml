# SP-01 - Telework and Flexible Work Schedules
# Seeded from app/src/strategies/registry.ts. This file is now the source of truth.

id: telework
uid: SP-01
name: Telework and Flexible Work Schedules
category: support
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [trip_generation]
purpose_applicability: [commute]
target_population: commute
capcoa_subsector: commute_trip_reduction
capcoa_measure: T-6
tags:
- policy
- commute
- employer
- site
short_description: Hybrid or full-remote work policies that eliminate commute trips on telework days.
extended_description: |
  Telework and remote work policies reduce commute travel by allowing employees to work away
  from their usual workplace on some or all workdays. Each telework day can eliminate a
  round-trip commute that would otherwise occur.

  The largest VMT reductions occur when eligible employees participate regularly and would
  otherwise drive longer distances. Results depend on the share of jobs eligible for
  telework, how often employees work remotely, and actual participation in the policy.
guidance: |
  Use this strategy for hybrid or fully remote policies and compressed work
  weeks. Enter the realistic average number of days worked from home, not the maximum
  allowed by the policy, because actual use is usually lower.
images: []
method: Direct commute-trip elimination on telework days
formula: Δcommute_VMT% = −%eligible × (telework_days / 5)
methodology_detail: |
  When eligible employees work from home, their commute trips disappear on those
  days, directly reducing commute vehicle miles traveled (VMT). The reduction is the
  share of workers who can telework multiplied by the average share of the work week
  they do.

  `Δcommute_VMT% = −%eligible × (telework_days / 5)`

  No extra effect size is applied; each skipped commute counts as avoided driving.
  (The 2021 CAPCOA Handbook no longer lists telework as its own measure; it treats
  telework as one part of a commute trip reduction program.) The default share of
  workers who can telework is estimated from the area's mix of jobs, drawn from
  American Community Survey (ACS) data.

  **Caveat: induced (rebound) travel.** This estimate captures only the commute trips
  that are eliminated on telework days, so it should be read as a *commute-trip
  reduction* and may overstate net VMT savings. A growing body of research finds that
  telework can induce offsetting travel: people make additional non-commute trips during
  the day, and the weaker tie to a daily commute can lead some households to choose homes
  farther from work, lengthening the trips they do make. The net effect on total VMT is
  uncertain and context-dependent, and in some cases telework can increase overall
  driving. Treat the figure here as an upper bound on commute-VMT savings rather than a
  guaranteed reduction in total VMT.
applicability: {}
inputs:
- key: pct_eligible
  label: Telework-eligible workforce
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0.5
  prerequisite: true
  summary: The estimated share of project area workers in jobs that can be done remotely.
  source_note: the area's occupation mix and assumptions around remote work policies
  tooltip: ACS occupation-mix-derived. Office/professional roles higher; manual/in-person roles lower.
  instructions: |
    Estimate the share of the area's workers in jobs that can be done remotely. The
    default is based on the local mix of jobs and assumptions around remote work.
    Adjust it if you know the specific employers involved.
- key: telework_days_per_week
  label: Days/week teleworked
  control: slider
  min: 0
  max: 5
  step: 0.5
  scale: 1
  suffix: ' days'
  default: 2
  prerequisite: true
  summary: The average number of days per week eligible employees actually work remotely, not the policy maximum (typical hybrid is 2-3 days).
  source_note: assumptions around remote work policies and/or actual policies implemented by employers
    in the project area
  tooltip: Average across eligible workers. Typical hybrid = 2-3 days.
  instructions: |
    Estimate the average number of days per week eligible employees actually work
    remotely, not the policy maximum. A typical hybrid policy lands around 2–3 days
    per week.
notes: ''
# Closed-form. UI bounds telework_days_per_week to 0-5 (the Python fn raises outside that).
compute:
  pool: commute
  formula: "-pct_eligible * (telework_days_per_week / 5)"
