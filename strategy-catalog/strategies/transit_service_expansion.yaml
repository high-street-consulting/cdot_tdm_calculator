# TR-01 Transit Service Frequency Increase
# Split from the former merged "Transit service expansion" tile: this file is the
# frequency-elasticity (headway-improvement) half. The service-miles half lives in
# new_transit_service.yaml. Both call strategy_transit_service_expansion.

id: transit_service_expansion
uid: TR-01
name: Transit Service Frequency Increase
category: transit
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [mode_shift]
purpose_applicability: [commute, recreational, other]
target_population: all_trips
capcoa_subsector: transit
capcoa_measure: T-26
tags:
- service
- transit
- transit-agency
- mpo
- urban
short_description: More frequent service (shorter waits) on existing transit routes, drawing riders out
  of cars.
extended_description: |
  Transit service frequency improvements reduce the scheduled headway (the time between
  arriving buses or trains) on an existing transit corridor. Shorter waits make transit
  easier to use, reduce scheduling challenges, and can make transit more time effective.

  The benefit depends on the existing service level, the size of the improvement, corridor
  demand, and reliability. More frequent service on a high-demand route will generally
  produce a larger response than small improvements spread across routes with limited
  demand.
guidance: |
  Use this strategy for existing service frequency increases. For implementation of new
  routes, route extensions, or new service, use the
  [Transit Service Expansion](#/strategies/new_transit_service)
  strategy instead.
images: []
method: Handy 2013 frequency elasticity (ε=0.5)
formula: ΔVMT% = −L × Δfreq × transit_MS × ε × (1/AVO) / auto_MS
methodology_detail: |
  When transit comes more often, riders spend less time waiting and more people
  choose transit over driving, lowering vehicle miles traveled (VMT). The bigger the
  improvement in frequency, the larger the ridership gain. This follows CAPCOA
  [T-26 (Increase Transit Service Frequency)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-26.pdf)
  and the frequency relationship in Handy et al. (2013).

  `ΔVMT% = −L × Δfreq × transit_MS × ε × (1/AVO) / auto_MS`

  The calculator uses local commute mode share from the American Community Survey
  (ACS) and a statewide average for vehicle occupancy. Use the implementation level
  to phase in a change that isn't fully in place yet.
applicability:
  area_types:
  - urban_core
  - urban
  - suburban
  warn_message: Frequency improvements deliver the most benefit where transit ridership is already established; in rural areas the effect is minimal.
inputs:
- key: pct_change
  label: Frequency change
  control: slider
  min: -50
  max: 200
  step: 5
  scale: 100
  suffix: '%'
  default: 0.25
  prerequisite: true
  summary: The percent change in how often service will operate compared with the existing service.
    This percentage will be positive for more frequent service, and it will be negative for a
    service cut.
  resources:
  - label: CDOT Statewide Transit Routes map
    url: https://cdot.maps.arcgis.com/home/item.html?id=dd812c7abb8e4017bc83e2cf9ef54824
  tooltip: Positive percentage = more frequent service; negative percentage = service frequency reduction.
  instructions: |
    Enter the percentage change in how often service runs on the affected routes. If
    service improves from every 30 minutes to every 20 minutes, frequency increases
    by 50% (30 ÷ 20 − 1); if it improves from every 60 minutes to every 30 minutes,
    frequency increases by 100% (60 ÷ 30 − 1). Compare the planned trips per hour (or
    vehicles per day) against the current schedule on the routes that overlap with the
    selected project area. Use a negative value to model a service cut.

    To check the existing transit routes, operators, and service in your area,
    access CDOT's
    [Statewide Transit Routes map](https://cdot.maps.arcgis.com/home/item.html?id=dd812c7abb8e4017bc83e2cf9ef54824)
    or your local transit agency's service plan.
- key: level_of_implementation
  label: Implementation level
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 1.0
  # Dropped from the "What you'll need" checklist per the 2026-07-21 content
  # review (the reviewer questioned whether a phase-in factor is needed here at
  # all); the control itself is retained pending a decision on removing it.
  prerequisite: false
  summary: What share of the frequency change will actually be in place. Use 100% for a full roll-out, less for a pilot on part of the network or a multi-year phase-in.
  source_note: your project scope / agency service plan
  tooltip: Phase-in factor. 100% = fully implemented across the impacted service area.
  instructions: |
    Use this to phase in the effect. 100% means the frequency change is fully in
    place across the impacted service area; a pilot on part of the network or a
    multi-year roll-out would be lower.

    To check the existing transit routes, operators, and service in your area,
    access CDOT's
    [Statewide Transit Routes map](https://cdot.maps.arcgis.com/home/item.html?id=dd812c7abb8e4017bc83e2cf9ef54824)
    or your local transit agency's service plan.
notes: 'Split from the merged transit service tile. Engine: strategy_transit_service_expansion (basis=frequency).'
