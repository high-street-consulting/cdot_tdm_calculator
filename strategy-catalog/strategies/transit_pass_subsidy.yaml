# TR-02 Transit Pass Subsidies
# Promoted from strategies/todo and split from the transit fare-subsidy engine:
# this is the general, all-trip half (scope=all). The commute/employer half is
# employee_commuting_benefits.yaml. Engine: strategy_transit_fare_subsidy.

id: transit_pass_subsidy
uid: TR-02
name: Transit Pass Subsidies
# Display category moved transit -> support ("Supportive & Programmatic") per the
# 2026-07-21 content review. The CAPCOA cap grouping is unchanged (capcoa_subsector
# below), so the displayed subsector cap is still Transit's.
category: support
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [mode_shift]
purpose_applicability: [commute, recreational, other]
target_population: all_trips
capcoa_subsector: transit
capcoa_measure: T-29
purpose_scope_input: vmt_scope
tags:
- pricing
- transit
- transit-agency
- local-government
short_description: Reduce the price of transit passes for residents or targeted users, raising ridership
  and shifting trips off the road.
extended_description: |
  This measure reduces the out-of-pocket cost of riding by offering discounted or
  free passes to residents, students, lower-income riders, or other eligible community
  members. When transit is less expensive and easily accessible, some trips may shift from
  driving to transit.

  The effect depends on who receives the subsidy and whether transit serves the trips
  those users need to make. Implementing this measure in areas with high-quality transit is
  likely to have a stronger effect than implementing the same measure in places where
  service is infrequent or indirect.
guidance: |
  Use this strategy when a transit agency, public program, or other sponsor
  reduces fares for the broader riding public. Use it **also for passes given to the
  residents of a development**, such as an RTD EcoPass provided to the occupants of a
  transit-oriented development: those passes affect all of a household's travel, not just
  commuting, which is the treatment this strategy applies.

  For passes provided to **employees** at a worksite, use [Employer-Provided Commute
  Benefits](#/strategies/employee_commuting_benefits)
  instead, which scopes the effect to commute trips.

  The split follows CAPCOA T-9, which covers both populations in one measure and separates
  them the same way: subsidies aimed at employees are limited to work-related trips, while
  "if residents are targeted, the GHG reductions extend to all trips."
images: []
method: Paulley (2006) short-run fare elasticity (ε=−0.30), all trips
formula: ΔVMT% = (Δfare × eligible × ε × transit_MS × 1/AVO) / auto_MS
methodology_detail: |
  Lowering the fare draws more riders onto transit, and some of those trips would
  otherwise have been made by car, so vehicle miles traveled (VMT) fall. A larger
  fare reduction reaching more riders produces a bigger shift. This follows CAPCOA
  [T-29 (Reduce Transit Fares)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-29.pdf)
  and the fare-response relationship in Paulley et al. (2006).

  `ΔVMT% = (Δfare × eligible × ε × transit_MS × 1/AVO) / auto_MS`

  The calculator uses local commute mode share from the American Community Survey
  (ACS), with statewide averages for vehicle occupancy and the typical fare. If you
  know the subsidy in dollars rather than a percentage, divide it by the average
  fare to get the percentage reduction.
applicability:
  area_types:
  - urban_core
  - urban
  - suburban
  warn_message: Fare reductions work where transit is a viable option; in rural areas with little service the effect is minimal.
inputs:
- key: pct_fare_reduction
  label: Fare reduction
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0.5
  prerequisite: true
  summary: The percent reduction in the effective fare riders pay (50% for half-price passes, 100% for free); a dollar subsidy divided by the average fare gives this percentage.
  source_note: your transit agency's fare and pass-subsidy data
  tooltip: Percent reduction in the effective fare (50% = half-price passes; 100% = free).
  instructions: |
    Enter the percentage reduction in the effective fare riders pay. A half-price
    pass program is 50%; a fully subsidized (free) pass is 100%. If you know the
    subsidy in dollars instead, divide it by the average fare to get the percentage.
- key: pct_eligible
  label: Share of riders eligible
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0.4
  prerequisite: true
  summary: The share of area transit riders eligible for the subsidized passes, a subset for a targeted program (students, low-income) and approaching 100% for a universal one.
  source_note: your project scope / eligible-population estimate
  tooltip: Share of area transit users covered by the subsidy.
  instructions: |
    Estimate the percentage of transit riders in the project area who would be eligible
    for the reduced fare. A program limited to students, income-qualified riders, or
    another specific group will cover only part of the transit-riding population, while
    a program available to all riders may approach 100%.
- key: vmt_scope
  label: VMT scope
  control: select
  default: all
  options:
  - value: all
    label: All trips
  - value: commute
    label: Commute trips only
  tooltip: Apply the reduction to all VMT, or only to commute VMT.
  summary: Whether the subsidy's reduction applies to all VMT or only commute VMT.
  instructions: |
    Choose whether this fare subsidy reduces all vehicle travel or only commute
    travel. Pick "Commute trips only" for an employer- or commute-focused pass
    program; pick "All trips" for a general, population-wide fare reduction.
    This selects which trip-purpose pool the reduction applies to in the
    combination engine; it does not change the per-rider effect.
notes: 'Promoted from todo; split from the fare engine. Engine: strategy_transit_fare_subsidy. vmt_scope gates purpose_applicability (purpose_scope_input).'
# Closed-form (transit fare subsidy, scope=all). Reads imputed transit/auto mode share + avo.
compute:
  pool: all
  const:
    elasticity: -0.30   # Paulley 2006 short-run transit fare elasticity
  formula: "pct_fare_reduction * pct_eligible * elasticity * transit_mode_share * (1 / avo) / max(auto_mode_share, 0.000000001)"
