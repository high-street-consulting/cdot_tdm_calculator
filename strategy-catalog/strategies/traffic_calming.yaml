- key: total_intersections
  label: Total intersections in project area
  control: number
  min: 0
  step: 1
  default: 0
  unit: intersections
  prerequisite: true
  summary: The total number of intersections in the project area, used to work out the share that
    receive calming.
  source_note: your project area map or GIS intersection layer
  tooltip: Total number of intersections in the project area, used to compute coverage.
  instructions: |
    Count the total intersections in the project area. If you provide only street counts
    (or only intersection counts), the calculator uses whichever coverage measure is
    available rather than averaging against a zero.
notes: 'Promoted from todo. Legacy CAPCOA 2010 SDT-2; superseded by the non-quantified T-35 in the 2021/2024 Handbook. Closed-form: math lives in the compute block below (no code calc fn). strategy_traffic_calming in scripts/strategy_calculations.py is retained as the cross-check oracle.'
# Closed-form math (single source of truth). Evaluated identically in Python and the app.
# Mirrors strategy_traffic_calming; one app-appropriate change: when NO coverage measure
# is entered (all totals 0) this returns 0 (no credit) where the Python fn raises.
compute:
  pool: all
  const:
    min_effect: 0.0025   # 0.25% (CAPCOA 2010 SDT-2 low end)
    max_effect: 0.0100   # 1.00% (SDT-2 high end = measure max)
  let:
    - s_ok: "if(total_streets > 0, 1, 0)"
    - i_ok: "if(total_intersections > 0, 1, 0)"
    - any_measure: "if(s_ok or i_ok, 1, 0)"
    - s_cov: "if(s_ok, streets_with_calming / max(total_streets, 1), 0)"
    - i_cov: "if(i_ok, intersections_with_calming / max(total_intersections, 1), 0)"
    # "use whichever measure is available rather than averaging against a zero"
    - cov_raw: "if(s_ok and i_ok, (s_cov + i_cov) / 2, if(s_ok, s_cov, if(i_ok, i_cov, 0)))"
    - coverage: "clamp(cov_raw, 0, 1)"
    - A: "clamp(min_effect + coverage * (max_effect - min_effect), 0, max_effect) * any_measure"
  formula: "-A"
