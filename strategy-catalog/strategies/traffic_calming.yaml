uid: BP-05
name: Traffic Calming
category: bikeped
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [mode_shift]
purpose_applicability: [commute, recreational, other]
target_population: all_trips
capcoa_subsector: neighborhood_design
tags:
- infrastructure
- bike
- walk
- local-government
short_description: Street design measures (e.g., speed humps, curb extensions) that slow vehicle speeds
  and improve safety.
extended_description: |
  Traffic calming helps to reduce vehicle speeds and improve the safety and comfort of people
  walking, biking, rolling, and accessing transit. Traffic calming makes biking and walking
  trips safer and more comfortable, which can potentially shift some trips from driving to
  multimodal travel. Traffic calming can include speed humps, curb extensions, chicanes, lane
  narrowing, median islands, mini roundabouts, and other changes to the streetscape that slow
  vehicle traffic and improve perceived and actual safety for users walking, biking, or
  rolling.

  The effect of traffic calming will vary based on roadway context, surrounding land use, and
  the strength of the active transportation network. Traffic calming is most effective when
  paired with high quality multimodal infrastructure like high-quality sidewalk networks and
  intersection crossings, high-comfort bike facilities, and transit access, especially in
  locations where high vehicle speeds or unsafe intersections discourage individuals from
  choosing alternative transportation modes.
guidance: |
  Use this strategy for implementation of roadway design measures that slow
  vehicle speeds and improve comfort for people walking, biking, rolling, or accessing
  transit. Traffic calming should generally be applied on local streets, school routes, or
  other low- to medium-volume corridors where speed and safety are barriers to non-driving
  trips.
images: []
method: CAPCOA 2010 SDT-2 (legacy)
formula: ΔVMT% = −clamp(0.25% + coverage × (1.00% − 0.25%), 0, 1.00%)
methodology_detail: |
  Traffic calming is credited using the 2010 CAPCOA measure
  [SDT-2 (Traffic Calming Measures)](https://www.aqmd.gov/docs/default-source/ceqa/handbook/capcoa-quantifying-greenhouse-gas-mitigation-measures.pdf),
  the only published method that assigns traffic calming a standalone VMT credit. The
  reduction scales SDT-2's documented 0.25%–1.00% range by how much of the project's
  network receives calming, taken as the average of the share of streets and the share of
  intersections with improvements (beyond what the jurisdiction already requires):

  `coverage = mean(share of streets calmed, share of intersections calmed)`

  `ΔVMT% = −(0.25% + coverage × (1.00% − 0.25%))`, capped at the 1.00% measure maximum.

  If only one of the two coverage shares is given, that one is used rather than averaging
  it against a zero. Both at 0% credits nothing.

  **Why shares and not counts.** The method resolves to a single 0.25%–1.00% band, so only
  the ratio was ever used; asking for four counts (calmed and total streets, calmed and
  total intersections) made the user tally every street and intersection in the area for no
  gain in precision. Note this measure cannot reflect *how much* calming a corridor gets:
  five speed humps and one score the same. That is a limit of the source literature, not of
  the inputs.

  **Legacy note:** In the 2021/2024 CAPCOA Handbook, traffic calming was reclassified as
  the *non-quantified* supporting measure T-35 and folded conceptually into pedestrian
  network improvements; it no longer carries a discrete VMT credit. This implementation is
  retained per CDOT's request for a standalone traffic-calming credit and is flagged as a
  legacy method. Avoid double-counting with the Pedestrian Network Improvements strategy.

  **Sources**

  - CAPCOA, *Quantifying Greenhouse Gas Mitigation Measures* (2010), Measure SDT-2, p. 190.
  - SMAQMD, *Recommended Guidance for Land Use Emission Reductions v3.0* (SDT-2 coverage
    variable definitions).
applicability:
  area_types:
  - urban_core
  - urban
  - suburban
  warn_message: Traffic calming carries only a small, legacy VMT credit (≤1%) and is most effective paired with active-transportation investments.
inputs:
- key: pct_streets_with_calming
  label: Share of streets with calming improvements
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0
  prerequisite: true
  summary: The share of the streets in the project area that will receive traffic-calming features.
    An estimate is fine; the method resolves to a single 0.25%-1.00% band, so precision here does
    not change the answer much.
  source_note: your project design drawings / plan set vs. your project area street network
  tooltip: Share of project-area streets receiving traffic-calming features. Leave at 0% if the project calms no streets.
  instructions: |
    Estimate the share of the streets in the project area that will receive
    traffic-calming features (speed humps, curb extensions, chicanes, lane narrowing,
    and so on). Judge it against the streets in the area you selected; you do not need
    an exact street count.

    Leave this at 0% if the project calms intersections only. The calculator then uses
    the intersection share on its own rather than averaging it against a zero.
- key: pct_intersections_with_calming
  label: Share of intersections with calming improvements
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0
  prerequisite: true
  summary: The share of the intersections in the project area that will receive calming features such
    as mini roundabouts, raised crossings, or curb extensions.
  source_note: your project design drawings / plan set vs. your project area intersections
  tooltip: Share of project-area intersections receiving calming features. Leave at 0% if the project calms no intersections.
  instructions: |
    Estimate the share of the intersections in the project area that will receive calming
    features such as mini roundabouts, raised crossings, or curb extensions.

    Leave this at 0% if the project calms streets only. Where both shares are given the
    calculator averages them; where only one is given it uses that one. With both at 0%
    the strategy credits nothing.
notes: 'Promoted from todo. Legacy CAPCOA 2010 SDT-2; superseded by the non-quantified T-35 in the 2021/2024 Handbook. Closed-form: math lives in the compute block below (no code calc fn). strategy_traffic_calming in scripts/strategy_calculations.py is retained as the cross-check oracle. 2026-07-27 (content review): simplified from four raw counts (streets_with_calming / total_streets / intersections_with_calming / total_intersections) to the two coverage SHARES, which is all the math ever used. Counting every street and intersection in a large area was the calculator''s most tedious input and bought no precision against a single 0.25%-1.00% band. Does NOT address the reviewer''s deeper request to count calming devices per corridor - the source literature cannot support that. Behaviour note: a 0% share now means "none of these are calmed" and is dropped from the mean, where the old form distinguished "0 of 80 streets" (averaged in as a zero) from "no street data" (omitted); with two shares that distinction is not expressible, and dropping zeros matches the documented "don''t average against a zero" rule.'
# Closed-form math (single source of truth). Evaluated identically in Python and the app.
# Mirrors strategy_traffic_calming. Both shares 0 -> 0 credit (not the 0.25% floor).
compute:
  pool: all
  const:
    min_effect: 0.0025   # 0.25% (CAPCOA 2010 SDT-2 low end)
    max_effect: 0.0100   # 1.00% (SDT-2 high end = measure max)
  let:
    - s_cov: "clamp(pct_streets_with_calming, 0, 1)"
    - i_cov: "clamp(pct_intersections_with_calming, 0, 1)"
    - s_ok: "if(s_cov > 0, 1, 0)"
    - i_ok: "if(i_cov > 0, 1, 0)"
    - any_measure: "if(s_ok or i_ok, 1, 0)"
    # "use whichever measure is available rather than averaging against a zero"
    - coverage: "if(s_ok and i_ok, (s_cov + i_cov) / 2, if(s_ok, s_cov, if(i_ok, i_cov, 0)))"
    - A: "clamp(min_effect + coverage * (max_effect - min_effect), 0, max_effect) * any_measure"
  formula: "-A"
