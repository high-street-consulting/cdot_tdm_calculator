# SP-06 Employer-Provided Commute Benefits
# Promoted from strategies/todo and split from the transit fare-subsidy engine:
# this is the commute/employer half (scope=commute). The general half is
# transit_pass_subsidy.yaml. Engine: strategy_transit_fare_subsidy.

id: employee_commuting_benefits
uid: SP-06
name: Employer-Provided Commute Benefits
category: support
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [mode_shift]
purpose_applicability: [commute]
target_population: commute
capcoa_subsector: commute_trip_reduction
capcoa_measure: T-9
tags:
- pricing
- transit
- employer
- developer
- commute
short_description: Employer-provided transit passes (ECO passes), pre-tax commuter benefits, and other
  recurring support that makes non-drive-alone commuting more affordable.
extended_description: |
  Employer-provided commute benefits make transit, vanpooling, and other non-drive-alone
  commute options more affordable for eligible employees. Examples include a subsidized
  transit pass, pre-tax commuter benefits, vanpool subsidies, and other recurring financial
  support for non-drive-alone commuting.

  The effectiveness of this strategy depends on the value of the benefit, the share of
  commuters eligible, and whether the supported travel options meet employees' needs.
  Transit benefits are generally most effective where service is frequent, reliable, and
  easy to access. Clear communication and complementary TDM measures can further increase
  participation.
guidance: |
  Use this strategy for commute benefits provided to **employees** at a
  worksite. For a general fare reduction, or for passes given to the **residents** of a
  development, use [Transit Pass
  Subsidies](#/strategies/transit_pass_subsidy)
  instead: resident passes affect all of a household's travel rather than commuting alone,
  which is how CAPCOA T-9 treats them.
  Avoid double-counting if [Workplace Parking
  Pricing](#/strategies/workplace_parking_pricing)
  cash-outs or [Commuter Rewards and
  Incentives](#/strategies/commute_incentives)
  are modeled for the same commuters.
images: []
method: Paulley (2006) fare elasticity (ε=−0.30), commute scope
formula: Δcommute_VMT% = (Δfare × eligible × ε × transit_MS × 1/AVO × p_drive) / auto_MS
methodology_detail: |
  Same short-run fare elasticity as the general pass subsidy (ε = −0.30, Paulley
  et al. 2006), here implementing CAPCOA
  [T-9 (Implement Subsidized or Discounted Transit Program)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-9.pdf),
  scoped to commute VMT and discounted by the share of benefiting commuters who
  would otherwise drive:

  `Δcommute_VMT% = (Δfare × eligible × ε × transit_MS × 1/AVO × p_drive) / auto_MS`

  When the benefit is entered as a dollar subsidy, the effective fare reduction is
  the subsidy divided by the average fare (statewide default unless provided).
  Mode share comes from the American Community Survey (ACS); Average vehicle occupancy is from the 2017 National Household Travel Survey (NHTS) statewide default.

  > **Caveat on the mode share (CAPCOA T-9).** The fact sheet warns against using
  > reported ACS commute mode share for this measure "unless the land use is office
  > or employment based on work location (rather than from home location)." ACS
  > commute mode share is tabulated by where people **live**, and this measure acts
  > on people who **work** at the benefiting site. The calculator uses the selected
  > zones' ACS mode share, so where a project area's residents commute differently
  > from the people who work there, the transit share feeding this estimate is off,
  > and it is a residence-based proxy for a workplace-based quantity. T-9 prefers a
  > work-trip mode share at census-tract scale or finer, which the calculator does
  > not currently carry. Treat the result as approximate in areas whose resident and
  > worker travel patterns diverge, such as a job centre with little housing.
applicability:
  area_types:
  - urban_core
  - urban
  - suburban
  warn_message: Transit commute benefits depend on employees having a usable transit option, which is limited in rural areas.
inputs:
- key: subsidy_amount
  label: Monthly/trip subsidy value
  control: number
  min: 0
  max: 200
  step: 0.5
  default: 2.0
  unit: $ per trip
  prerequisite: true
  summary: 'Enter the transit benefit for one one-way commute trip. For a monthly pass or subsidy,
    divide the monthly value by the number of one-way transit commute trips taken in a typical
    month. For example, if someone uses their RTD Monthly Pass ($88 per month) to get to and from
    work 20 days per month (40 one-way trips), this equals $2.20 per trip.'
  source_note: transit benefits provided by your employer, such as an employer-provided unlimited
    transit pass, fare subsidy, or monthly transit allowance
  tooltip: Dollar value of the commute benefit per transit trip; converted to an effective fare reduction.
  instructions: |
    Enter the dollar value of the benefit for each transit trip. The calculator will
    compare this amount with the average transit fare. If the benefit is provided as a
    monthly pass or allowance, divide its monthly value by the typical number of commute
    transit trips made each month.
- key: pct_eligible
  label: Share of commuters eligible
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0.5
  prerequisite: true
  summary: The share of area commuters offered the benefit. For a single employer this is its share of area commuters; for a development requirement, use the share at the affected sites.
  source_note: your project scope / employer or development participation estimate
  tooltip: Share of area commuters offered the benefit.
  instructions: |
    This is two things multiplied together, and it helps to think of them separately:

    1. **Coverage.** The share of the commuters **in the area you selected** who work
       at sites offering the benefit. For a single employer, that employer's share of
       area commuters. For a development requirement, the share of area commuters
       working at the affected sites. Never a share of the whole region's workforce.
    2. **Eligibility.** Of those, the share who actually have access to the benefit.
       CAPCOA T-9 expects this to be near 100%, and calls out contract and temporary
       workers who do not receive employee benefits as the usual exclusion.

    Enter the product. This is *access*, not take-up: the fare elasticity below
    already accounts for how many of those offered the benefit change their commute.
notes: 'Promoted from todo; split from the fare engine. Engine: strategy_transit_fare_subsidy (scope=commute).'
# Closed-form (transit fare subsidy, scope=commute, $-subsidy). Reads imputed mode share + avo.
compute:
  pool: commute
  const:
    avg_fare: 2.5            # statewide default transit fare ($)
    elasticity: -0.30
    pct_otherwise_drive: 0.85
  let:
    - pct_fare_reduction: "subsidy_amount / avg_fare"
  formula: "pct_fare_reduction * pct_eligible * elasticity * transit_mode_share * (1 / avo) / max(auto_mode_share, 0.000000001) * pct_otherwise_drive"
