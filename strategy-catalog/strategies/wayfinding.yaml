notes: 'Promoted from todo. Derived, assumption-bounded; 0.25%/channel uplift is a conservative default. Closed-form: math lives in the compute block below (no code calc fn). strategy_wayfinding in scripts/strategy_calculations.py is retained as the cross-check oracle. NOTE: the parent-gate fields (transit_vrh, transit_route_count, bike_centerline_mi) and observed avo are NOT yet published on the app TAZ layer; until they are, the app uses row_defaults (gates OFF -> conservative no-credit) and the statewide default AVO, so app numbers approximate Python until those fields are added to queryTaz TAZ_FIELDS + the feature service.'
# Closed-form math (single source of truth). Evaluated identically in Python and the app.
# Mirrors strategy_wayfinding. Reads IMPUTED row fields (transit_mode_share, auto_mode_share,
# avo, supplied by the host's imputation helpers) and parent-gate fields (row_defaults below).
compute:
  pool: all
  const:
    r_uplift: 0.0025   # transit channel assumed ridership uplift (0.25%)
    c_uplift: 0.0025   # active-mode channel assumed connectivity uplift (0.25%)
    ped_e: 0.05        # abs(-0.05) borrowed T-18 elasticity
    cap: 0.005         # 0.5% per-channel cap
  row_defaults:
    transit_vrh: 0
    transit_route_count: 0
    bike_centerline_mi: 0
  let:
    - transit_gate: "if(transit_vrh > 0 or transit_route_count > 0, 1, 0)"
    - active_gate: "if(bike_centerline_mi > 0, 1, 0)"
    - ch_t_raw: "loi_transit * r_uplift * transit_mode_share * (1 / avo) / max(auto_mode_share, 0.000000001)"
    - ch_t: "clamp(ch_t_raw, 0, cap) * transit_gate"
    - ch_a_raw: "loi_active * c_uplift * ped_e"
    - ch_a: "clamp(ch_a_raw, 0, cap) * active_gate"
    - combined: "1 - (1 - ch_t) * (1 - ch_a)"
  formula: "-combined"
