# TR-06 Transit Service Expansion
# Split from the former merged "Transit service expansion" tile: this file is the
# service-miles-elasticity (new route / added revenue miles) half. The frequency
# half lives in transit_service_expansion.yaml. Both call
# strategy_transit_service_expansion (this one fixes basis=service_miles).
# NOTE the id/filename are historical: `new_transit_service` is the display
# "Transit Service Expansion" strategy, while the id `transit_service_expansion`
# is the frequency strategy. Ids are stable and must not be renamed.

id: new_transit_service
uid: TR-06
name: Transit Service Expansion
category: transit
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [mode_shift]
purpose_applicability: [commute, recreational, other]
target_population: all_trips
capcoa_subsector: transit
capcoa_measure: T-25
tags:
- service
- transit
- transit-agency
- mpo
short_description: New routes, route extensions, or expanded operating hours for an existing transit
  network, giving more people a transit option.
extended_description: |
  Increased transit service introduces transit access where it was not previously available
  or extends service to new areas. This may include a new local route, an extension of an
  existing route, or expanded operating hours. The service is most useful when it links
  people to jobs, schools, services, or activity centers at times that match actual travel
  needs.

  The effect of expanded transit service depends on how many riders the service attracts
  and how many of those trips would otherwise have been made by driving alone. Increased
  service is most likely to reduce VMT where it connects places people already need to
  travel, offers reliable travel times, and offers connectivity between transit stops and
  final destinations.

  This strategy models **fixed-route** transit service (scheduled routes along a fixed
  alignment). Demand-responsive services such as microtransit and on-demand circulators
  are not modeled as part of this strategy.
guidance: |
  Use this when a project expands fixed-route service with new routes, route extensions,
  or expanded operating hours. To increase how often existing routes run, use
  [Transit Service Frequency Increase](#/strategies/transit_service_expansion)
  instead.
images: []
method: TCRP 95 service-miles elasticity (ε=0.75)
formula: ΔVMT% = −L × Δservice × transit_MS × ε × (1/AVO) × trip_reduction_ratio
methodology_detail: |
  Extending transit into new areas gives more people a usable alternative to
  driving, so some car trips shift to transit and vehicle miles traveled (VMT) fall.
  The more service is added relative to what exists today, the larger the ridership
  gain. This follows CAPCOA
  [T-25 (Extend Transit Network Coverage or Hours)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-25.pdf)
  and the service-miles relationship in Transit Cooperative Research Program (TCRP)
  Report 95.

  `ΔVMT% = −L × Δservice × transit_MS × ε × (1/AVO) × trip_reduction_ratio`

  The calculator uses local commute mode share from the American Community Survey
  (ACS) and a statewide average for vehicle occupancy (the average number of people
  per car), and it discounts for new transit trips that don't fully replace a car
  trip. Use the implementation level to phase in service that isn't fully running
  yet.
applicability:
  area_types:
  - urban_core
  - urban
  - suburban
  warn_message: New transit coverage reduces the most driving where density supports ridership; expect a limited effect in rural areas.
inputs:
- key: pct_change
  label: Service-mile change
  control: slider
  min: -50
  max: 200
  step: 5
  scale: 100
  suffix: '%'
  default: 0.2
  prerequisite: true
  summary: The percent change in revenue miles the new or extended service adds, compared with
    the existing network serving your area.
  source_note: your local transit agency’s service plan
  resources:
  - label: CDOT Statewide Transit Routes map
    url: https://cdot.maps.arcgis.com/home/item.html?id=dd812c7abb8e4017bc83e2cf9ef54824
  tooltip: Positive percentage = added revenue miles / new routes; negative percentage = a service cut.
  instructions: |
    Enter the percentage change in transit revenue miles for the affected area.
    Compare the daily (or annual) revenue miles of the new/extended service
    against the existing network serving the area. For a brand-new route in an
    area with little prior service, this can be large; for a modest extension it
    may be a few percent.

    Revenue miles can grow either way: a new route or route extension adds miles
    of new alignment, and **expanded operating hours add miles on alignments that
    already exist** (running an existing route two hours later each evening adds
    those trips' revenue miles). Either one belongs in this input.

    To check the existing transit routes, operators, and service in your area,
    access CDOT's
    [Statewide Transit Routes map](https://cdot.maps.arcgis.com/home/item.html?id=dd812c7abb8e4017bc83e2cf9ef54824)
    or your local transit agency's service plan.
- key: level_of_implementation
  label: Implementation level
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 1.0
  prerequisite: true
  summary: Compare the existing transit service (if any) to the planned transit service expansion.
    Considerations include any changes to routes, service area, operating hours, or days of
    service. Also determine whether the service will be fully implemented from the start or
    if there will be an initial pilot program or phased service roll-out.
  source_note: your project scope / agency service plan
  tooltip: 100% = the new/expanded service is fully operating.
  instructions: |
    If the planned service will be fully implemented and available throughout the
    entire project area from the start, enter 100%. If the service will initially
    operate as a pilot or at a reduced scale, enter a lower percentage based on how
    much of the full planned service will be provided. Consider factors such as the
    number of routes, service area, operating hours, or days of service included in
    the initial phase. For example, if the initial phase provides approximately half
    of the routes or service hours included in the full plan, enter 50%.

    To check the existing transit routes, operators, and service in your area,
    access CDOT's
    [Statewide Transit Routes map](https://cdot.maps.arcgis.com/home/item.html?id=dd812c7abb8e4017bc83e2cf9ef54824)
    or your local transit agency's service plan.
auto_filled_summary:
- mode share
- vehicle occupancy
- baseline VMT
notes: 'Split from the merged transit service tile. Engine: strategy_transit_service_expansion (basis=service_miles).'
# Closed-form (transit service expansion, service_miles basis fixed). Reads imputed mode share + avo.
compute:
  pool: all
  const:
    elasticity: 0.75    # TCRP 95 service-miles midpoint
    trip_red_ratio: 0.7
  formula: "-level_of_implementation * pct_change * transit_mode_share * elasticity * (1 / avo) * trip_red_ratio"
