# SP-04 Commuter Rewards and Incentives
# Split from the former merged "Commute program (marketing / incentives)" tile:
# this is the incentive-campaign half (~3%). Engine: strategy_commute_program
# (defaults to the incentive effect size).

id: commute_incentives
uid: SP-04
name: Commuter Rewards and Incentives
category: support
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [mode_shift]
purpose_applicability: [commute]
target_population: commute
capcoa_subsector: commute_trip_reduction
capcoa_measure: T-5
tags:
- program
- commute
- employer
- local-government
short_description: Financial or non-financial rewards that encourage employees to try or maintain a
  specific non-drive-alone commute behavior.
extended_description: |
  Financial or non-financial rewards that encourage employees to try or maintain a specific
  non-drive-alone commute behavior. Examples may include prizes, gift cards, trip-based
  rewards, commute challenges, or temporary bonuses for using transit, carpooling,
  vanpooling, bicycling, or another eligible option.

  Use this strategy when the benefit is tied to completing a specific action or meeting a
  participation goal. For ongoing transit passes, fare subsidies, or other recurring
  employer-provided commute benefits, use [Employer-Provided Commute
  Benefits](#/strategies/employee_commuting_benefits).
guidance: |
  Use this strategy for reward and incentive-driven programs. To avoid
  double-counting for awareness and promotion without payments, use the
  [TDM Marketing
  Campaigns](#/strategies/commute_marketing)
  strategy. To avoid double counting for benefits provided by employers, use the
  [Employer-Provided Commute
  Benefits](#/strategies/employee_commuting_benefits)
  strategy.
images: []
method: CAPCOA T-5 / T-6 (Commute Trip Reduction), incentive-heavy ≈3%
formula: Δcommute_VMT% = −%eligible × reduction_per_eligible
methodology_detail: |
  Incentive-heavy commute programs reduce commute VMT by roughly 3% per eligible
  commuter, drawn from the commute-trip-reduction evidence in CAPCOA
  [T-5 (voluntary)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-5.pdf)
  and [T-6 (mandatory)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-6.pdf).
  Programs that pair financial incentives with outreach land toward the upper end
  of that range:

  `Δcommute_VMT% = −%eligible × reduction_per_eligible`

  Adjust the per-commuter rate to match the level of incentives antcipated in the program.
applicability: {}
inputs:
- key: pct_eligible
  label: Share of workforce eligible
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0.5
  prerequisite: true
  summary: The share of area employees eligible for the reward/incentive program. For a single
    employer, this is its share of area commuters; for a regional program, use the eligible
    workforce share.
  source_note: your project scope / employer or program participation estimate
  tooltip: Share of area employees eligible for the incentives.
  instructions: |
    Estimate the share of area employees eligible for the incentive program. For a
    single employer, this is its share of area commuters; for a regional program,
    estimate the eligible workforce share.
- key: reduction_per_eligible
  label: Reduction per eligible commuter
  control: slider
  min: 1
  max: 3
  step: 0.1
  scale: 100
  suffix: '%'
  default: 0.03
  prerequisite: true
  summary: The estimated percentage reduction in commute VMT among employees eligible for the program.
    Use 3% for programs that provide meaningful, recurring rewards for changing commute behavior.
    Use a lower value for programs with small, temporary, or infrequently offered rewards.
  source_note: CAPCOA T-5/T-6 default (3%); adjust from your program's incentive level
  tooltip: 3% = default for a well-rounded program; 1-2% for a program with less frequent or impactful rewards.
  instructions: |
    The default 3% reflects programs that provide meaningful and recurring rewards for
    commute behavior changes. Use a lower figure for less frequent or impactful rewards.
notes: 'Split from commute_program. Engine: strategy_commute_program (incentive default ~3%).'
# Closed-form (commute program). reduction_per_eligible is a user input (default 0.03).
compute:
  pool: commute
  formula: "-pct_eligible * reduction_per_eligible"
