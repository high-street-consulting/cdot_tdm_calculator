short_description: Reduce roadway capacity by removing general-purpose travel lanes, such as through a
  road diet. Removing lane miles can reduce VMT, while adding lane miles can increase VMT through
  induced demand; the magnitude depends on the roadway type and surrounding context.
extended_description: |
  This measure is primarily intended to estimate the potential VMT reduction associated with
  removing through-lane capacity. To model a reduction, enter the removed lane miles as a
  **negative** value: for example, enter `-2` for a project that removes two lane-miles of
  general-purpose capacity.

  The same relationship can also be used to estimate the effect of adding roadway capacity.
  Adding lane miles is not a TDM strategy, but modeling the increase can help users understand
  the potential negative VMT impacts of a project compared with the baseline.

  Effects are typically greater on major freeways and other high-volume facilities than on
  lower-volume streets or for smaller capacity changes.
guidance: |
  Use this strategy to estimate VMT reductions from removing general-purpose
  lane capacity, such as through a road diet. It can also be used to estimate the added VMT
  associated with new general-purpose lanes compared with the baseline. Other improvements
  such as turn lanes, bus-only lanes, or safety projects should be evaluated based on their
  specific purpose.
images: []
method: Duranton & Turner 2011 long-run induced-demand elasticities
formula: ΔVMT% = (new_lane_miles / existing_lane_miles_in_class, selected area) × ε
methodology_detail: |
  Widening a road or adding lanes makes driving easier, which over time generates
  more vehicle miles traveled (VMT), an effect known as induced demand. The added
  driving is proportional to how much the new lanes increase capacity for that type
  of road.

  `ΔVMT% = (new_lane_miles / existing_lane_miles_in_class) × ε`

  Both terms are totals for the **whole selected area**: the lane miles your
  project adds or removes, over the lane miles of that road class across every
  zone you have selected. The result is an area-wide percentage, because the
  Duranton & Turner elasticity relates a region's total VMT to that region's total
  lane miles. Selecting a wider area therefore gives the same project a smaller
  percentage effect, spread across a larger baseline.

  The strength of the effect depends on the road type: freeways and expressways
  bring out the most new travel, arterials less, and collectors and local streets
  the least (Duranton & Turner 2011). Induced demand is not a CAPCOA reduction
  measure, so no CAPCOA reference applies — and because it is a supply-side
  change rather than a behavioral one, it sits outside the CAPCOA overlap caps
  and is added to the project total directly. Its bound comes from the method
  instead: a road diet cannot remove more lane miles than the area has, so the
  largest reduction this measure can return is ε itself — 60% on arterials, 40%
  on collectors and local streets, 100% on freeways. An entry that removes more
  than the existing stock is reduced to it, and the result is flagged.
applicability: {}
inputs:
- key: new_lane_miles
  label: Net change in general-purpose lane miles
  control: number
  step: 0.1
  default: 2.0
  prerequisite: true
  summary: The net change in through-lane miles the project makes (negative for a road diet, positive
    for added lanes), excluding turn lanes and shoulders.
  source_note: your project scope / roadway design
  tooltip: 'Signed net change in through-lane miles, excluding turn lanes and shoulders. Positive = lanes added; negative = a road diet (lanes removed).'
  instructions: |
    Enter the net change (+ or −) in general purpose through-lane miles the project
    makes: lane-miles, not centerline miles (a 2-mile project adding one lane each way
    is 4 lane-miles). Use a **negative** value to model a **road diet** that removes
    through-lane capacity (e.g. `-4` for a 2-mile project that removes one lane each
    way). Use a **positive** value for added roadway capacity. Exclude turn lanes,
    auxiliary lanes, and shoulders.

    Enter the figure for the **whole project once**, not per zone. It is measured
    against the lane miles of that road class across your entire selected area, so
    a road diet is a bigger percentage in a tight downtown selection than in one
    that sweeps in a whole county. Removing more lane miles than the area has is
    not possible: an entry beyond the existing stock is reduced to it and noted in
    the results.
  min: -20
  unit: lane-mi
- key: facility_class
  label: Facility class
  control: select
  options:
  - value: freeway
    label: Freeway (ε = +1.0)
  - value: expressway
    label: Expressway (ε = +1.0)
  - value: major_arterial
    label: Major arterial (ε = +0.6)
  - value: minor_arterial
    label: Minor arterial (ε = +0.6)
  - value: collector
    label: Collector (ε = +0.4)
  - value: local
    label: Local (ε = +0.4)
  default: major_arterial
  prerequisite: true
  summary: The functional classification of the road being widened or narrowed.
  source_note: the functional class of the road in your project scope
  resources:
  - label: 'CDOT Highways: Functional Class'
    url: https://cdot.maps.arcgis.com/home/item.html?id=06fbbd720f6641c2b6faefcf453ba474
  tooltip: Sets how strongly new capacity brings out traffic. Existing lane miles for the area come from the loaded network.
  instructions: |
    Select the functional classification of the roadway where general-purpose lane
    capacity is being removed or added. The facility class determines how strongly the
    VMT estimate responds to the capacity change: effects are generally greatest on
    freeways and expressways, smaller on arterials, and lowest on collectors and local
    streets. To determine this value, match the selected class to the functional
    classification of the modified roadway corridor.

    To look the classification up rather than judge it, CDOT publishes
    [Highways: Functional Class](https://cdot.maps.arcgis.com/home/item.html?id=06fbbd720f6641c2b6faefcf453ba474),
    whose categories map onto the options above: Interstate and Principal Arterial
    (Freeways and Expressways) correspond to freeway and expressway, Principal
    Arterial (Other) to major arterial, Minor Arterial to minor arterial, Major and
    Minor Collector to collector, and Local to local. It covers state highways, so a
    project on a city street will not appear in it.
notes: ''
