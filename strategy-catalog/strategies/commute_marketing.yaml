# SP-03 TDM Marketing Campaigns
# Split from the former merged "Commute program (marketing / incentives)" tile:
# this is the marketing/outreach half (~1%). Engine: strategy_commute_program
# (defaults to the marketing effect size).

id: commute_marketing
uid: SP-03
name: TDM Marketing Campaigns
category: support
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [mode_shift]
purpose_applicability: [commute]
target_population: commute
capcoa_subsector: commute_trip_reduction
capcoa_measure: T-7
tags:
- program
- commute
- employer
- local-government
short_description: Outreach, information, and awareness campaigns encouraging employees to try
  alternative-mode commutes.
extended_description: |
  TDM Marketing Campaigns are planned outreach efforts that inform and connect a defined
  audience with alternative transportation options they can realistically use. These
  campaigns can support new or existing services by helping people understand how to take the
  next step, such as using transit, joining a vanpool, or biking to work.

  Marketing works best when the message is tied to clear travel options. Broad awareness
  alone is unlikely to change travel behavior if the alternative is inconvenient, unclear,
  or unsupported by high quality multimodal infrastructure, transit service, incentives,
  or other TDM measures.
guidance: |
  Use this strategy for information- and awareness-driven programs. When the
  program provides payments, subsidies, rewards, or prizes to encourage mode shift, use the
  [Commuter Rewards and
  Incentives](#/strategies/commute_incentives)
  strategy instead.
images: []
method: CAPCOA T-7 (Commute Trip Reduction Marketing), marketing-only ≈1%
formula: Δcommute_VMT% = −%reached × reduction_per_reached
methodology_detail: |
  Marketing-only commute programs reduce commute VMT by roughly 1% per reached
  commuter ([CAPCOA T-7, Implement Commute Trip Reduction Marketing](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-7.pdf), low end):

  `Δcommute_VMT% = −%reached × reduction_per_reached`

  Adjust the per-commuter rate if local evaluation supports a different value.
applicability: {}
inputs:
- key: pct_eligible
  label: Share of workforce reached
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0.5
  prerequisite: true
  summary: The estimated share of area employees reached by the marketing campaign. For a single
    employer, this is its share of area commuters; for a regional campaign, use the workforce share.
  source_note: your project scope / marketing campaign reach estimate
  tooltip: Share of all project area employees at workplaces that are targeted by the marketing program.
  instructions: |
    This is two things multiplied together, and it helps to think of them separately:

    1. **Coverage.** The share of the employees **in the area you selected** who work
       at workplaces the campaign targets. For a single employer, that employer's
       share of area employees. For a regional campaign, the share of *this area's*
       employees the campaign reaches, never a share of the whole region's workforce.
    2. **Eligibility.** Of those, the share who could actually take part. CAPCOA
       expects this to be near 100%, trimmed only for people who genuinely cannot
       participate: night-shift staff when transit and rideshare are not running,
       employees required to drive as part of the job, and contract or temporary
       workers excluded from the program.

    Enter the product. Note this is *eligibility*, not take-up: CAPCOA is explicit
    that it "does not refer to the percent of employees who actually participate in
    the program", because the per-commuter reduction below already accounts for that.
- key: reduction_per_eligible
  label: Reduction per reached commuter
  control: slider
  min: 0.5
  max: 3
  step: 0.1
  scale: 100
  suffix: '%'
  default: 0.01
  prerequisite: true
  summary: The commute-VMT reduction per commuter reached by the marketing program. Keep the 1%
    marketing-only default unless the project scope supports a higher value.
  source_note: CAPCOA T-7 default (1%); raise only with local program evaluation
  tooltip: 1% = marketing based program default (CAPCOA T-7 low end). Raise only with local evidence.
  instructions: |
    The default 1% reflects marketing/outreach-only programs. Increase it only if
    local program evaluation documents a stronger response; stronger results
    usually come from pairing outreach with incentives. For more benefits see the
    [Commuter Rewards and Incentives](#/strategies/commute_incentives) strategy.
notes: 'Split from commute_program. Engine: strategy_commute_program (marketing default ~1%).'
# Closed-form (commute program). reduction_per_eligible is a user input (default 0.01).
compute:
  pool: commute
  formula: "-pct_eligible * reduction_per_eligible"
