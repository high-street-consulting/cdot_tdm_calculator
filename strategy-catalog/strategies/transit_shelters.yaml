# TR-09 Transit shelters
# New strategy (CAPCOA T-46). No master-sheet stub existed; the related
# transit_facilities_improvement (TR-05) stub remains in todo. Engine: strategy_transit_shelters.

id: transit_shelters
uid: TR-09
name: Transit Shelters
category: transit
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [mode_shift]
purpose_applicability: [commute, recreational, other]
target_population: all_trips
capcoa_subsector: transit
capcoa_measure: T-46
tags:
- infrastructure
- transit
- transit-agency
- local-government
short_description: Shelters and station amenities that make waiting for transit more comfortable, raising
  ridership.
extended_description: |
  Transit shelters and station improvements (covered seating, lighting, real-time arrival
  information, and other amenities) make waiting for transit more comfortable. Transit
  shelters provide covered waiting areas that make using transit more comfortable and
  convenient, particularly during poor weather. Improved waiting conditions can support a
  modest increase in transit ridership, including some trips that would otherwise have been
  made by driving, reducing vehicle miles traveled.

  The effect depends on how many stops are improved and on the area's existing transit mode
  share, and shelters add the most where transit is already a viable option. Shelters are a
  station-improvement amenity within the broader transit toolkit, and they are best paired
  with the calculator's transit service frequency and fare reduction strategies.
guidance: |
  Use this strategy for projects that add or upgrade transit shelters and stop
  amenities. Where some of the area's stops are already BRT stations, enter that share below:
  BRT projects include their own station amenities, so that share is excluded here rather than
  counted twice.
images: []
method: CAPCOA T-46 (structural; constants pending fact-sheet confirmation)
formula: ΔVMT% = −clamp(LOI × ridership_uplift × transit_MS × (1/AVO) / vehicle_MS, 0, 15%)
methodology_detail: |
  Transit shelters and station improvements raise transit's attractiveness, producing a
  small ridership gain that converts to a vehicle miles traveled (VMT) reduction through the
  same ridership-to-VMT machinery as CAPCOA
  [T-26 (Increase Transit Service Frequency)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-26.pdf),
  following Measure
  [T-46 (Provide Transit Shelters)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-46.pdf):

  `ΔVMT% = −(LOI × ridership_uplift × transit_MS × (1/AVO) / vehicle_MS)`, capped at the 15%
  Transit subsector maximum.

  The mode-shift factor uses the area's **observed** average vehicle occupancy (1/AVO) rather
  than the national default, and local transit and vehicle mode shares come from the area
  data.

  **Overlap with Bus Rapid Transit.** CAPCOA T-28 (Bus Rapid Transit) already funds station
  amenities, so shelters at BRT stations would be counted twice. The credit is therefore
  scaled by `1 − BRT stop share`: enter the share of the area's stops already covered by BRT
  station investment and that share is excluded, leaving the rest creditable. This is a
  partial exclusion, because a BRT corridor inside a project area rarely means every route in
  the area is BRT.

  > **Constants pending confirmation.** The verbatim T-46 equation and constants (the
  > shelter ridership uplift and the measure maximum) were not captured during research and
  > the fact sheet was unreadable at implementation time. The ridership uplift and measure
  > maximum are **placeholders** exposed in the code (`TRANSIT_SHELTERS_T46`) for
  > recalibration and should be confirmed against the T-46 fact sheet before the numeric
  > results are relied upon. Outputs flag this assumption.

  **Sources**

  - CAPCOA *Handbook* (2021), Measure
    [T-46 (Provide Transit Shelters)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-46.pdf);
    conversion machinery from Measure
    [T-26](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-26.pdf).
  - Handy, S., et al. (2013). *Impacts of Transit Service Strategies on Passenger Vehicle Use
    and GHG Emissions*. CARB.
applicability:
  area_types:
  - urban_core
  - urban
  - suburban
  warn_message: Shelters add ridership mainly where transit is already viable; results use placeholder constants pending CAPCOA T-46 confirmation.
inputs:
- key: level_of_implementation
  label: Share of stops with shelters/improvements
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 1.0
  prerequisite: true
  summary: The share of the area's transit stops or stations that will receive new shelters or amenity
    improvements. Use 100% for improvements at all transit stops within the study area, or less for
    improvements only at a subset of stops.
  source_note: your project scope / stop-improvement plan
  resources:
  - label: CDOT Statewide Transit Points
    url: https://cdot.maps.arcgis.com/home/item.html?id=dd8e77e36c9d4d67a7a5845c55d79687
  tooltip: Share of area transit stops receiving shelters or station improvements.
  instructions: |
    Estimate the share of the area's transit stops or stations that will receive new shelters
    or amenity improvements. Use 100% for a system-wide program; lower it for a targeted set
    of stops.

    To count the stops in your area rather than estimate them, CDOT publishes
    [Statewide Transit Points](https://cdot.maps.arcgis.com/home/item.html?id=dd8e77e36c9d4d67a7a5845c55d79687),
    a statewide layer of transit stops and stations.
- key: brt_stop_share
  label: Share of stops already covered by BRT stations
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0
  prerequisite: true
  summary: The share of the area's transit stops that are already BRT stations. BRT projects fund
    station amenities themselves, so this share is excluded here to avoid double counting. Leave at
    0% where the area has no BRT.
  source_note: your area's existing/planned BRT coverage
  tooltip: Share of area stops already covered by BRT station investment. That share is excluded from the shelter credit; 0% = no BRT in the area.
  instructions: |
    Enter the share of the area's transit stops that are already BRT stations, or are
    scheduled to receive BRT station investment. Leave it at 0% if the area has no BRT.

    Bus Rapid Transit projects pay for their own station amenities, so crediting shelters
    at those same stops would double-count. The calculator excludes exactly that share of
    the credit and keeps the rest, which is the usual case: a BRT corridor running through
    a project area rarely means every route in the area is BRT.
notes: 'New strategy (CAPCOA T-46). shelter_ridership_uplift and measure_max are PLACEHOLDER constants pending fact-sheet confirmation. Closed-form: math lives in the compute block below (no code calc fn). strategy_transit_shelters in scripts/strategy_calculations.py is retained as the cross-check oracle. 2026-07-27 (content review): the all-or-nothing brt_covers_all_routes select was replaced by brt_stop_share, a 0-100% slider defaulting to 0, and the T-28 overlap is now a PARTIAL exclusion (credit scaled by 1 - brt_stop_share). Rationale: a BRT corridor inside a project area almost never means every route in that area is BRT, so the old flag was either never true or wildly over-applied when it was. brt_stop_share = 100% reproduces the old zeroing.'
# Closed-form math (single source of truth). Evaluated identically in Python and the app.
# Mirrors strategy_transit_shelters. Reads imputed transit_mode_share/auto_mode_share/avo.
# brt_stop_share: share of area stops already covered by BRT station investment; that share
# of the credit is excluded to avoid double-counting T-28 (which funds its own stations).
compute:
  pool: all
  const:
    shelter_ridership_uplift: 0.0050   # PLACEHOLDER: ridership uplift at improved stops
    measure_max: 0.15                  # Transit subsector cap (stand-in for measure max)
  let:
    - a_raw: "level_of_implementation * shelter_ridership_uplift * transit_mode_share * (1 / avo) / max(auto_mode_share, 0.000000001)"
    - a: "clamp(a_raw, 0, measure_max)"
    - brt: "clamp(brt_stop_share, 0, 1)"
    - credit: "a * (1 - brt)"
  formula: "-credit"
