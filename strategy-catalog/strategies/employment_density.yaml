# LU-02 - Increased Employment Density
# Split from the former merged "Employment / residential density" tile: this is the
# employment / job-density half (CAPCOA T-2). Engine: strategy_density_change
# (residential held at 0).

id: employment_density
uid: LU-02
name: Increased Employment Density
category: landuse
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [trip_length]
purpose_applicability: [commute, recreational, other]
target_population: attraction_end
capcoa_subsector: land_use
capcoa_measure: T-2
tags:
- land-use
- all-trips
- developer
- local-government
- urban
short_description: Increase jobs per acre (including mixed-use intensification) to shorten trips and
  support non-auto commuting.
extended_description: |
  Increasing employment density places more jobs, stores, and services within a smaller
  area. When development is also well connected to housing, transit, and safe walking and
  biking routes, this can shorten some trips, make non-driving options more practical, and
  reduce VMT compared with accommodating the same amount of employment in a lower-density,
  more automobile-oriented pattern.

  Adding jobs and destinations can still increase the total number of trips and total VMT
  within the project area. This strategy should therefore not be interpreted as showing that
  a new development will reduce overall VMT compared with today.
guidance: |
  Use this strategy to compare a job-focused or mixed-use development with a
  lower-density development pattern accommodating a similar amount of employment. This
  strategy does not estimate whether adding jobs will reduce total VMT in the project area.
  For a project that changes both housing and employment density, combine this strategy with
  [Increased Residential
  Density](#/strategies/residential_density).
  Consider the results together, since the relationship between homes, jobs, destinations,
  and transportation options influences the actual VMT outcome.
# Results framing: the credit is VMT avoided against the identified lower-density baseline,
# not a reduction versus today's travel (2026-07-21 content review).
impact_direction: avoided
impact_qualifier: relative to the identified baseline
images: []
method: Stevens (2016) employment VMT-density elasticity (ε=−0.07)
formula: ΔVMT% = Δemp_density × ε_emp
methodology_detail: |
  Adding jobs and destinations to an area shortens trips and makes walking, biking,
  and transit more practical, which lowers vehicle miles traveled (VMT). A 1%
  increase in employment density has been associated with about a 0.07% reduction
  in VMT (Stevens 2016), the basis CAPCOA uses for
  [T-2 (Increase Job Density)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-2.pdf).
  Job density is a weaker lever than housing density, so the percentage is smaller.

  `ΔVMT% = Δemp_density × ε_emp`

  To represent a change in the mix of land uses or a mixed-use development, combine
  this strategy with Increase residential density.
applicability:
  area_types:
  - urban_core
  - urban
  - suburban
  warn_message: The density–driving relationship comes from urban and suburban areas; in rural areas, added density yields little reduction in driving.
inputs:
- key: pct_change_emp_density
  label: Change in employment density
  control: slider
  min: -50
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0.2
  prerequisite: true
  summary: The percent change in jobs per acre under the proposed development compared with the
    selected baseline. The baseline should represent either current job density or a clearly
    defined lower-density development alternative.
  source_note: your development program / site plan vs. local baseline job density
  tooltip: Proposed job density compared with the identified baseline.
  benchmark: 'Jobs/sq mi: suburban office park ~5,000–15,000; dense urban district ~30,000–50,000; downtown Denver core ~60,000.'
  instructions: |
    Enter the percentage change in job density compared with the identified baseline
    for the project area. A project that doubles job density is +100%.

    Approximate benchmarks (jobs per square mile):

    - Suburban office park or commercial: ~5,000–15,000
    - Dense urban employment district: ~30,000–50,000
    - Downtown Denver office core: ~60,000

    These are order-of-magnitude anchors that will vary based on the project area.
notes: 'Split from density_change. Engine: strategy_density_change (pct_change_res_density=0).'
# Closed-form (densityChange with res=0). strategy_employment_density retained as oracle.
compute:
  pool: all
  const:
    emp_elasticity: -0.07   # Stevens 2016
  formula: "pct_change_emp_density * emp_elasticity"
