# SP-05 - TMO or TMA Coverage Expansion
# Seeded from app/src/strategies/registry.ts. This file is now the source of truth.

id: tmo_coverage
uid: SP-05
name: TMO or TMA Coverage Expansion
category: support
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [mode_shift]
purpose_applicability: [commute]
target_population: commute
capcoa_subsector: commute_trip_reduction
capcoa_measure: T-5
tags:
- program
- commute
- employer
- local-government
- mpo
short_description: Bring more employers under a Transportation Management Organization or Association
  that coordinates TDM programs across a district.
extended_description: |
  Expanded Transportation Management Organization or Association (TMO/TMA) coverage (whether
  from an existing or new TMO/TMA) extends coordinated TDM services to more employers and
  commuters within a defined area, corridor, district, or employment center.

  A TMO/TMA is a formal partnership that provides shared TDM services for a defined area.
  These services may include employer outreach, program administration, commuter assistance,
  marketing, data collection, and coordination among employers, property owners, and public
  agencies.

  The effect depends on the number of commuters reached, the range and quality of services
  provided, employer participation, and the availability of practical alternatives to driving
  alone.
guidance: |
  Use this strategy to model the creation of a new TMO/TMA or the expansion of
  an existing one. The benefit should be based on the additional share of the workforce or
  travel market covered by active TMO/TMA services.
images: []
method: CAPCOA T-5 (voluntary CTR) midpoint, 4% per eligible
formula: Δcommute_VMT% = −(share_after − share_before) × r_CTR
methodology_detail: |
  A Transportation Management Organization helps more employees shift out of driving
  alone by coordinating commute programs across many worksites. Each newly covered
  worker is credited with about a 4% reduction in commute vehicle miles traveled
  (VMT), following the voluntary commute trip reduction evidence in CAPCOA
  [T-5 (Implement Commute Trip Reduction Program, Voluntary)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-5.pdf).

  `Δcommute_VMT% = −(share_after − share_before) × r_CTR`

  Only the *change* in coverage counts, so enter the share of the workforce the
  organization covers today and the share it will cover after the expansion.
applicability:
  area_types:
  - urban_core
  - urban
  - suburban
  warn_message: Transportation Management Organizations rely on a cluster of employers and commute alternatives, which are limited in rural areas.
inputs:
- key: share_before
  label: TMO/TMA Workforce coverage today
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0.0
  prerequisite: true
  summary: The share of the area's employees who already work at TMO-member worksites today (0% for a brand-new TMO/TMA).
  source_note: current TMO/TMA membership rolls vs. area employment
  tooltip: Share of area employees at TMO/TMA member workplaces.
  instructions: |
    Estimate the share of the employees **in the area you selected** who already work
    at TMO/TMA member worksites today. For a brand-new TMO/TMA this is 0%; for an
    expansion, use the current membership's share of that area's employment.

    The denominator is always this project area's employees, never a regional
    workforce total, because the reduction applies to the commute VMT of the zones you
    selected.
- key: share_after
  label: TMO/TMA Workforce coverage after
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0.4
  prerequisite: true
  summary: The target share of area employees who will work at TMO/TMA member worksites after the new
    or expanded organization is in place.
  source_note: your TMO/TMA expansion plan / membership targets
  tooltip: Target share after new TMO/TMA is established or an existing TMO/TMA expands.
  instructions: |
    Estimate the share of the employees **in the area you selected** who will work at
    TMO/TMA member worksites after the new or expanded organization is in place. The
    difference between this and today's coverage is what drives the reduction, so a
    regional expansion is entered as the share of *this area's* employees it brings
    under coverage, not a regional total.
notes: ''
# Closed-form. strategy_tmo_coverage retained as oracle.
compute:
  pool: commute
  const:
    r_ctr: 0.04   # CAPCOA TRT-1 midpoint, per eligible
  formula: "-(share_after - share_before) * r_ctr"
