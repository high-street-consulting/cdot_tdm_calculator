# BP-08 - Pedestrian network improvements
# New strategy (CAPCOA T-18). No master-sheet stub existed. Engine: strategy_pedestrian_network_improvements.

id: pedestrian_network_improvements
uid: BP-08
name: Pedestrian Network Improvements
category: bikeped
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [mode_shift]
purpose_applicability: [commute, recreational, other]
target_population: all_trips
capcoa_subsector: neighborhood_design
capcoa_measure: T-18
tags:
- infrastructure
- walk
- local-government
short_description: New and repaired sidewalks that close gaps in the pedestrian network, shifting short
  trips from driving to walking.
extended_description: |
  Pedestrian network improvements include adding new sidewalks, and repairing sidewalks whose
  condition makes them unusable today. A more complete, comfortable pedestrian network
  encourages people to walk for short trips that would otherwise be made by car, lowering
  vehicle miles traveled.

  The effect depends on how much the sidewalk network expands relative to the street network
  and on how many nearby trips are short enough to walk. Sidewalk investments are most
  effective in compact, mixed-use areas where destinations are close together and the main
  barrier is a missing or broken pedestrian connection.
guidance: |
  Use this strategy for projects that add sidewalks, or repair sidewalks that
  are currently unusable, anywhere in the area you selected. Measure sidewalk length on both
  sides of the street: a 0.5-mile street with a sidewalk on both sides of the street is 1.0
  mile of sidewalk.

  Count repaired sidewalk only where the repair takes a segment from unusable to usable, so
  that it makes walking trips practical where they were not before. Resurfacing or upgrading
  a sidewalk that people can already walk on does not add pedestrian coverage, and the method
  credits added coverage.
images: []
method: CAPCOA T-18 (verbatim)
formula: ΔHouseholdVMT% = ((C / B) − 1) × −0.05
methodology_detail: |
  Adding sidewalk coverage shifts some short household trips from driving to walking,
  following CAPCOA
  [T-18 (Provide Pedestrian Network Improvement)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-18.pdf):

  `ΔVMT% = ((C / B) − 1) × D`

  where **B** is existing sidewalk length, **C** is sidewalk length with the measure (both
  measured on both sides of the street), and **D = −0.05** is the elasticity of household
  vehicle travel with respect to the sidewalk-to-street ratio (Frank et al. 2011; Handy et
  al. 2014).

  **Study area.** T-18 frames the ratio over a walkable study area around the improvement.
  The calculator measures it over **the TAZs you selected** instead, because that is the
  geography every other input and the baseline VMT already use. Selecting an area larger than
  the walkshed dilutes the ratio, so this will tend to understate the effect slightly rather
  than overstate it. Repaired sidewalk counts only where the repair returns an unusable
  segment to service, since the elasticity is on pedestrian *coverage*, not condition.

  The reduction is capped at a **6.4% measure maximum**, derived from the share of vehicle
  trips short enough to shift to walking (FHWA 2019). *Reviewer note:* the fact sheet
  references a 3.4% figure in one location and 6.4% in the cap derivation and worked example;
  6.4% is used here per the worked example, flagged for confirmation. The credit applies to
  household vehicle travel; because the calculator does not carry a household-only VMT split,
  it is applied to all-trip VMT and flagged accordingly.

  *Worked example:* B = 9 miles, C = 10 miles → `((10/9) − 1) × −0.05 = −0.56%`.

  **Sources**

  - CAPCOA *Handbook* (2021), Measure
    [T-18 (Provide Pedestrian Network Improvement)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-18.pdf),
    pp. 133–136.
  - Frank, L., et al. (2011). WSDOT Research Report WA-RD 765.1.
  - Handy, S., et al. (2014). *Impacts of Pedestrian Strategies on Passenger Vehicle Use and
    GHG Emissions*. CARB.
applicability:
  area_types:
  - urban_core
  - urban
  - suburban
  warn_message: Sidewalk improvements shift mostly short trips; the effect is small in low-density areas where destinations are far apart.
inputs:
- key: existing_sidewalk_mi
  label: Existing sidewalk length
  control: number
  min: 0
  step: 0.5
  default: 9
  unit: miles
  prerequisite: true
  summary: The existing sidewalk length in the selected area.
  source_note: your sidewalk inventory or GIS layer / study-area measurement
  tooltip: Existing sidewalk length in the selected area, measured on both sides of the street.
  instructions: |
    Enter the existing sidewalk length in the selected area. Measure on both sides of the
    street: a 0.5-mile street with a sidewalk on both sides is 1.0 mile; coverage on one
    side only is 0.5 mile.
- key: sidewalk_mi_with_measure
  label: Sidewalk length with the project
  control: number
  min: 0
  step: 0.5
  default: 10
  unit: miles
  prerequisite: true
  summary: The total sidewalk length in the selected area after the project (existing plus new, plus
    any sidewalk the project repairs from unusable to usable), measured on both sides of the street.
  source_note: your project design drawings / plan set
  tooltip: Sidewalk length in the selected area after the project, both sides of the street. Count repaired sidewalk only where the repair makes an unusable segment usable.
  instructions: |
    Enter the sidewalk length after the project, measured the same way (both sides of the
    street). This must be at least the existing length.

    Include new sidewalk, plus repaired sidewalk **only where the repair takes a segment from
    unusable to usable** and so makes walking trips practical where they were not before.
    Resurfacing sidewalk that is already walkable adds no pedestrian coverage and should not
    be counted, because the method credits added coverage rather than condition.
notes: 'New strategy (CAPCOA T-18, verbatim). Trip pool is household VMT, approximated as all-trip VMT. Amax=6.4% (3.4% discrepancy flagged for reviewer). Closed-form: math lives in the compute block below (no code calc fn). strategy_pedestrian_network_improvements in scripts/strategy_calculations.py is retained as the cross-check oracle.'
# Closed-form math (single source of truth). Evaluated identically in Python and the app.
# Mirrors strategy_pedestrian_network_improvements. B (existing) is guarded > 0 via max().
compute:
  pool: all
  const:
    elasticity: -0.05    # household VMT w.r.t. sidewalk-to-street ratio (Frank 2011; Handy 2014)
    measure_max: 0.064   # 6.4% measure maximum (FHWA 2019)
  let:
    - ratio: "sidewalk_mi_with_measure / max(existing_sidewalk_mi, 0.000000001)"
    - a_raw: "(ratio - 1) * elasticity"
    - a: "clamp(a_raw, -1 * measure_max, 0)"
  formula: "a"
