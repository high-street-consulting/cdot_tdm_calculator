inputs:
- key: unbundled_parking_charge
  label: Annual charge per parking space
  control: number
  min: 0
  step: 100
  default: 1200
  unit: $/year
  prerequisite: true
  summary: The annual charge a resident will pay for one parking space now priced separately from rent (for example, $100/month = $1,200/year).
  source_note: your project pro forma / parking pricing policy
  tooltip: Annual price charged to residents per unbundled parking space (e.g. $100/mo = $1,200/yr).
  instructions: |
    Enter the annual charge a resident pays for one parking space, now priced separately from
    rent (e.g. $100/month = $1,200/year). For reference, bundled garage parking adds roughly
    $1,700/year to renter housing costs (Gabbe & Pierce 2017). Larger charges produce larger
    reductions, up to the 15.7% cap.
- key: free_parking_nearby
  label: Free parking readily available nearby?
  control: select
  default: 'no'
  options:
  - value: 'no'
    label: No, free on-street/off-site parking is not readily available
  - value: 'yes'
    label: Yes, free parking is readily available nearby
  prerequisite: true
  summary: Whether residents can readily park free on-street or nearby; if so, unbundling has no effect and the estimate returns zero.
  source_note: your knowledge of on-street and off-site parking near the site
  tooltip: Required precondition. If free parking is readily available on-street or nearby, the measure does not work and returns zero.
  instructions: |
    Choose "Yes" only if residents can readily park free on the street or elsewhere near the
    project. If so, unbundling has no effect (residents avoid the charge by parking free
    nearby) and the calculator returns a zero reduction. Choose "No" where parking is
    genuinely constrained.
