# BP-07 - Workplace Bicycle Amenities
# Split from the former "Bike mode-share booster" tile: this is the workplace /
# commute half (scope=commute). On-street infrastructure is now sharrows_bike_lanes.
# Engine: strategy_bike_mode_share_booster (scope=commute).

id: end_of_trip_facilities
uid: BP-07
name: Workplace Bicycle Amenities
category: bikeped
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [mode_shift]
purpose_applicability: [commute]
target_population: commute
capcoa_subsector: commute_trip_reduction
capcoa_measure: T-10
tags:
- infrastructure
- bike
- employer
- commute
- site
short_description: Workplace bike parking, showers, and lockers that raise bike commute mode share by a
  documented effect size.
extended_description: |
  Workplace bike amenities, such as secure bicycle parking, lockers, showers, changing
  rooms, and repair stations, make bicycling to work more practical and convenient for
  employees. These amenities help address common barriers that may otherwise discourage
  bicycle commuting.

  The effect depends on whether employees live within a reasonable bicycling distance and
  whether the surrounding bicycle network provides a safe, comfortable, and direct
  connection to the worksite. Amenities at locations served by connected, high-quality
  bicycle routes will generally have a stronger effect than similar amenities at sites that
  are difficult to reach by bicycle.
guidance: |
  Use this strategy for workplace bicycle amenities provided by an employer or
  developer to support employee commute trips. For improvements to the surrounding
  on-street bicycle network, use one of the bike facility infrastructure strategies instead:
  [Striped Bike Lanes, Neighborhood Bikeways and
  Sharrows](#/strategies/sharrows_bike_lanes)
  or [Protected or Buffered Bike
  Lanes](#/strategies/separated_bike_lanes).
images: []
method: CAPCOA T-10 (Provide End-of-Trip Bicycle Facilities), commute scope
formula: Δcommute_VMT% = −scope_share × L_bike × (bike_MS × adj) / (L_veh × auto_MS)
methodology_detail: |
  Showers, lockers, and secure bike parking remove a common reason people don't bike
  to work, leading more employees to bike for their commute and lowering commute
  vehicle miles traveled (VMT). Providing these facilities raises the share of
  commute trips made by bike by about 5% among employees who have access, following
  CAPCOA
  [T-10 (Provide End-of-Trip Bicycle Facilities)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-10.pdf).
  Because bike trips are shorter than car trips, the calculator accounts for that
  when converting added bike commutes into driving avoided.

  `Δcommute_VMT% = −scope_share × L_bike × (bike_MS × adj) / (L_veh × auto_MS)`

  This applies the same bike effect as [Striped Bike Lanes, Neighborhood Bikeways and
  Sharrows](#/strategies/sharrows_bike_lanes),
  focused on commuters at a worksite rather than across an area.
applicability:
  area_types:
  - urban_core
  - urban
  - suburban
  warn_message: Biking to work is most practical at denser, bike-served worksites; the effect is limited in rural areas.
inputs:
- key: scope_share
  label: Share of commuters with access
  control: slider
  min: 0
  max: 100
  step: 1
  scale: 100
  suffix: '%'
  default: 0.4
  prerequisite: true
  summary: The share of commuters in your area who work at sites that will provide workplace
    bicycle amenities.
  source_note: current or planned building amenities
  tooltip: The percentage of project area commuters who work at sites that provide workplace bike amenities.
  instructions: |
    Estimate the share of commuters in your project area who work at sites that
    will provide end-of-trip facilities. For a single large employer, this is the
    employer's share of area commuters; for a development standard applied to new
    workplaces, estimate the share of commuters those sites represent.
notes: 'Split from bike_mode_share_booster. Engine: strategy_bike_mode_share_booster (scope=commute).'
# Closed-form (bike mode-share booster, commute scope fixed). Reads imputed bike/auto mode share.
compute:
  pool: commute
  const:
    adj: 0.05       # end-of-trip bike-share boost
    bike_len: 1.5
  row_defaults:
    avg_trip_length: 9.0
  formula: "-scope_share * bike_len * (bike_mode_share * adj) / (max(avg_trip_length, 0.5) * max(auto_mode_share, 0.000000001))"
