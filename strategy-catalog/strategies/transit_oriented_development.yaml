# LU-03 - Transit Oriented Development
# Seeded from app/src/strategies/registry.ts. This file is now the source of truth.

id: transit_oriented_development
uid: LU-03
name: Transit Oriented Development
category: landuse
status: implemented
# --- CAPCOA combination tags (Phase 1; see tdm_strategy_combination_spec.md) ---
mechanism: [mode_shift]
purpose_applicability: [commute, recreational, other]
target_population: all_trips
capcoa_subsector: land_use
capcoa_measure: T-3
measure_cap: 31
tags:
- land-use
- transit
- commute
- developer
- transit-agency
- urban
short_description: Higher-density mixed-use development around high-quality transit. Residents shift commute
  trips to transit at a rate documented by CAPCOA T-3.
extended_description: |
  Transit-oriented development places compact, mixed-use development within walking
  distance of high-quality transit, typically around a rail station or major bus hub.
  Locating residents near frequent transit can increase transit commuting and reduce
  driving compared with accommodating the same residents in a less transit-accessible
  development pattern. Nearby jobs, shops, and services can provide additional benefits by
  allowing some daily trips to be made without driving.

  Adding homes, jobs, and activity around a station can still increase total trips and total
  VMT within the project area. This strategy should therefore not be interpreted as showing
  that a new development will reduce overall VMT compared with today. The calculator
  estimates reduced driving among those traveling to and from the TOD walkshed compared with
  the baseline. Benefits are greatest where frequent transit, safe walking routes, connected
  streets, and parking management make driving less necessary.
guidance: |
  Use this strategy to compare development around an existing or planned
  high-quality transit station with otherwise similar development in a non-TOD area. For
  density that is not associated with a transit station, use
  [Increased Residential
  Density](#/strategies/residential_density)
  or [Increased Employment
  Density](#/strategies/employment_density)
  instead.

  **Choose by policy lever, not by distance.** Transit-oriented development and a density
  increase often look alike on the ground, since both add density, but they are separate
  policy actions working through different mechanisms. Use this strategy when the action is
  station-area development coordinated with high-quality transit. Use the density strategies
  when the action is a land use or zoning change that raises density, even if the site
  happens to sit near transit and the travel effect ends up similar. There is no distance
  threshold that decides this for you.
# Results framing: the credit is VMT avoided against a less transit-accessible baseline
# development pattern, not a reduction versus today's travel (2026-07-21 content review).
impact_direction: avoided
impact_qualifier: relative to the baseline travel pattern
images: []
method: CAPCOA T-3 (Transit-Oriented Development); Lund 2004 / Cervero 2007 / Chatman 2013
formula: ΔVMT% = −%TAZ_in_TOD × (min(TOD_ratio × transit_MS, cap) − transit_MS) / auto_MS
methodology_detail: |
  Living within walking distance of high-quality transit leads residents to ride
  transit far more and drive far less, lowering vehicle miles traveled (VMT). The
  calculator gives residents inside the walkshed a transit share equal to the
  area's transit share times a multiplier (4.9× by default, the typical rail-station
  value), capped at 50% as a realistic ceiling. This follows CAPCOA
  [T-3 (Provide Transit-Oriented Development)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-3.pdf),
  drawing on Lund (2004), Cervero (2007), and Chatman (2013).

  `ΔVMT% = −%TAZ_in_TOD × (min(TOD_ratio × transit_MS, cap) − transit_MS) / auto_MS`

  The effect grows with the share of the area's population that lives inside the
  walkshed. Commute mode share comes from American Community Survey (ACS) data.
  Lower the multiplier for development served by bus only, which shifts fewer trips
  than rail. Where a station has both bus and rail, the higher (rail) value applies:
  the strongest service sets the ceiling on how much travel the station area shifts.
applicability:
  area_types:
  - urban_core
  - urban
  - suburban
  warn_message: Transit-oriented development depends on high-quality transit, which is generally limited to urban and suburban areas.
inputs:
- key: pct_taz_in_tod
  label: Share of TAZ within TOD walkshed
  control: slider
  min: 0
  max: 100
  step: 5
  scale: 100
  suffix: '%'
  default: 0.1
  prerequisite: true
  summary: The share of the project area's population that is expected to live inside the ½-mile
    walkshed around the station, based on planned TOD housing.
  source_note: your development program / site plan vs. the TAZ population
  tooltip: Share of the area's population estimated to live within the ½-mi transit-oriented development walkshed.
  instructions: |
    Estimate the share of the area's population that will live inside the TOD
    walkshed, roughly the ½-mile area around the station that is comfortable to
    walk. Compare the planned TOD housing (or population) against the total for the
    area you selected. If the TOD covers only part of a large zone, this share is
    small.

    You need to estimate this yourself: the calculator cannot derive the walkshed from
    a station location, because it has no zone geometry available while you are working.
- key: tod_mode_share_ratio
  label: Transit Mode Share Multiplier
  control: number
  step: 0.1
  default: 4.9
  prerequisite: true
  summary: The transit mode-share multiplier for the TOD. Keep 4.9x where the station has rail, or
    lower it (2-3x) for a TOD served by bus only. Where a station has both, use the rail value.
  source_note: the transit service serving your TOD (rail vs. bus)
  tooltip: CAPCOA T-3 default = 4.9× (rail-station TODs). Lower for bus-only TODs. Rail plus bus uses the rail value.
  instructions: |
    Leave at the 4.9× default for development around a rail station (the CAPCOA
    T-3 value). Lower it for TODs served by bus only, which shift fewer trips; a
    2–3× multiplier is more realistic for frequent bus service.

    Where a station is served by **both** bus and rail, take the higher of the two
    values, which means using the rail multiplier. The stronger service sets the
    ceiling on how much travel the station area can shift; adding bus alongside rail
    does not lower it.
  min: 1.0
  max: 10.0
notes: ''
# Closed-form (CAPCOA LUT-4). tod_mode_share_ratio is a user input. Reads imputed mode share.
compute:
  pool: all
  const:
    max_tod_transit_share: 0.50   # realistic ceiling
  let:
    - tod_transit: "min(transit_mode_share * tod_mode_share_ratio, max_tod_transit_share)"
    - delta: "tod_transit - transit_mode_share"
  formula: "-pct_taz_in_tod * delta / max(auto_mode_share, 0.000000001)"
