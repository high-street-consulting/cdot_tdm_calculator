method: Adapted CAPCOA T-19-A
formula: ΔVMT% = −%VMT_parallel × (days/365) × ε × L_bike / L_veh
methodology_detail: |
  A protected or buffered bike lane can make bicycling a practical option for some trips
  that would otherwise be made by car, reducing vehicle miles traveled (VMT). The estimated
  effect depends on the share of study-area VMT occurring on the bikeway corridor and
  relevant parallel streets, the number of days per year suitable for bicycling, and the
  typically shorter length of bicycle trips compared with car trips. The calculation follows
  CAPCOA
  [T-19-A (Construct or Improve Bike Facility)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-19-a.pdf)
  and [T-20 (Expand Bikeway Network)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-20.pdf),
  using a +0.07 effect size.

  `ΔVMT% = −%VMT_parallel × (annual_use_days / 365) × ε × L_bike / L_veh`

  Local commute travel and trip lengths come from the area data; the number of
  comfortable cycling days is estimated for the area from National Oceanic and
  Atmospheric Administration (NOAA) climate records.

  **Sources**

  - CAPCOA, *Handbook for Analyzing Greenhouse Gas Emission Reductions* (2021),
    measures [T-19-A (Construct or Improve Bike Facility)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-19-a.pdf)
    and [T-20 (Expand Bikeway Network)](https://www.caleemod.com/documents/handbook/ch_3_transportation/measure_t-20.pdf).
  - [NOAA NCEI, 1991–2020 U.S. Daily Climate Normals](https://www.ncei.noaa.gov/products/land-based-station/us-climate-normals)
applicability:
  area_types:
  - urban_core
  - urban
  - suburban
  warn_message: Protected bike lanes show a limited effect below suburban densities.
inputs:
- key: pct_parallel_vmt_affected
  label: Share of study-area VMT affected by the bikeway
  control: slider
  min: 0
  max: 70
  step: 1
  scale: 100
  suffix: '%'
  default: 0.05
  prerequisite: true
  summary: The percentage of total VMT in the selected area that occurs on the bikeway corridor
    and nearby parallel streets where some driving trips could reasonably shift to bicycling.
  resources:
  - label: CDOT Traffic Data Explorer
    url: https://dtdapps.codot.gov/otis/trafficdata
  tooltip: 'Engineering judgment: share of the corridor''s driving carried on the street the new bike lane runs on and nearby parallel roads.'
  instructions: |
    Estimate the share of total VMT in the selected study area that occurs on the
    bikeway corridor and nearby parallel streets where driving trips could reasonably
    shift to bicycling. Because the calculator uses TAZ-based travel data, it cannot
    directly model a specific bikeway on a single corridor. If VMT data is available
    for the corridor, divide the VMT on the bikeway corridor and relevant parallel
    streets by total VMT in the selected study area. Otherwise, use available traffic
    counts and local knowledge to develop and document a reasonable estimate.

    CDOT's [Traffic Data Explorer](https://dtdapps.codot.gov/otis/trafficdata)
    provides annual average daily traffic counts for state highways.
- key: annual_use_days
  label: Annual ridable days
  control: number
  step: 5
  default: 230
  tooltip: Filled in from National Oceanic and Atmospheric Administration (NOAA) 1991-2020 climate records for
    your area. Adjust if you have a project-specific number.
  instructions: |
    Enter the estimated number of days per year with weather suitable for bicycling.
    The calculator automatically fills this value using National Oceanic and
    Atmospheric Administration (NOAA) climate records and a default definition of
    daytime temperatures between 32°F and 95°F with no rain or snow. Override the
    default only when a better local estimate is available, such as community
    bicycle-count or travel-survey data.
  min: 0
  max: 365
  unit: days
  prepopulated_from: annual_bikeable_days_taz
notes: ''
# Closed-form (CAPCOA bike facility). annual_use_days is seeded by the UI (NOAA-derived), so the
# Python provenance fallback chain is dead for UI calls. Reads avg_trip_length (row_default fallback).
compute:
  pool: all
  const:
    elasticity: 0.07   # CAPCOA T-21 bike facility
    bike_len: 1.5
  row_defaults:
    avg_trip_length: 9.0
  formula: "-pct_parallel_vmt_affected * (annual_use_days / 365) * elasticity * bike_len / max(avg_trip_length, 0.5)"
