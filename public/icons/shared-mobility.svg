<?xml version="1.0" encoding="UTF-8"?>
<!-- Shared Mobility category icon.
     Replaces vanpool.svg for this group, which now covers commuter vanpool,
     carshare and shared micromobility - so a van alone no longer describes it.
     Motif: a simplified vehicle inside a broken circular loop, the common
     shorthand for shared/rotating access rather than one specific device.
     Rendered as a CSS mask filled with currentColor (see CategoryIcon.tsx), so
     both strokes and fills become glyph; nothing here carries its own colour. -->
<svg width="100pt" height="100pt" version="1.1" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Shared-use loop: one circle, dashed into two long arcs with a gap at the
       upper right and lower left. Dash lengths are derived from the radius, so
       changing r=40 (circumference 251.33) means recomputing "100 25.66". -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#000" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="100 25.66"
          transform="rotate(-45 50 50)"/>
  <!-- Vehicle, simplified side view: body with a cabin taper, plus two wheels. -->
  <path d="M29 57.5 L29 50.5 Q29 47.4 32.2 46.9 L37.6 46.4 L41.8 40.6
           Q42.9 39 45 39 L56.5 39 Q58.6 39 59.7 40.6 L63.9 46.4 L69.3 46.9
           Q72.5 47.4 72.5 50.5 L72.5 57.5 Z"/>
  <circle cx="38.5" cy="59.5" r="4.6"/>
  <circle cx="63" cy="59.5" r="4.6"/>
</svg>
